    - data:
        code: "import re\nimport json\n\ndef main(input_string: str) -> dict:\n  \
          \  raw_content = input_string\n    try:\n        parsed = json.loads(input_string)\n\
          \        # 如果解析出来是dict，并且含有text字段，取text\n        if isinstance(parsed, dict)\
          \ and \"text\" in parsed:\n            raw_content = parsed[\"text\"]\n\
          \        # 如果解析出来直接是list，直接使用\n        elif isinstance(parsed, list):\n\
          \            return {\"result\": parsed}\n    except json.JSONDecodeError:\n\
          \        raw_content = input_string\n\n    # 兼容markdown ```json ```\n  \
          \  pattern_match = re.search(r'```json\\s*([\\s\\S]*?)\\s*```', raw_content)\n\
          \    if pattern_match:\n        json_content = pattern_match.group(1).strip()\n\
          \    else:\n        json_content = raw_content.strip()\n\n    if not json_content:\n\
          \        raise ValueError(\"未获取到待解析的JSON内容\")\n\n    try:\n        parsed_json\
          \ = json.loads(json_content)\n    except json.JSONDecodeError as err:\n\
          \        raise ValueError(f\"JSON 解析失败: {err}, raw={json_content}\")\n\n\
          \    return {\n        \"result\": parsed_json\n    }"
